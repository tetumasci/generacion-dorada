<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" role="img" aria-labelledby="t d">
  <title id="t">Tres medallas</title>
  <desc id="d">Una medalla de oro con el año 2004, una de plata con 2002 y una de bronce con 2008.</desc>
  <rect width="600" height="260" fill="#EAF3FB"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#0B1D33">
    <!-- Plata -->
    <path d="M85 20 L115 20 L145 110 L115 110 Z" fill="#75AADB"/>
    <path d="M175 20 L145 20 L115 110 L145 110 Z" fill="#0B1D33"/>
    <circle cx="130" cy="150" r="62" fill="#B8C0CC" stroke="#0B1D33" stroke-width="4"/>
    <circle cx="130" cy="150" r="48" fill="none" stroke="#0B1D33" stroke-width="2"/>
    <text x="130" y="162" font-size="34" font-weight="700">2002</text>
    <text x="130" y="248" font-size="20" font-weight="700">Plata · Mundial</text>
    <!-- Oro -->
    <path d="M270 10 L300 10 L330 100 L300 100 Z" fill="#75AADB"/>
    <path d="M360 10 L330 10 L300 100 L330 100 Z" fill="#0B1D33"/>
    <circle cx="315" cy="145" r="72" fill="#D4A82A" stroke="#0B1D33" stroke-width="4"/>
    <circle cx="315" cy="145" r="56" fill="none" stroke="#0B1D33" stroke-width="2"/>
    <text x="315" y="158" font-size="40" font-weight="700">2004</text>
    <text x="315" y="248" font-size="20" font-weight="700">Oro · Atenas</text>
    <!-- Bronce -->
    <path d="M455 20 L485 20 L515 110 L485 110 Z" fill="#75AADB"/>
    <path d="M545 20 L515 20 L485 110 L515 110 Z" fill="#0B1D33"/>
    <circle cx="500" cy="150" r="62" fill="#C58A4B" stroke="#0B1D33" stroke-width="4"/>
    <circle cx="500" cy="150" r="48" fill="none" stroke="#0B1D33" stroke-width="2"/>
    <text x="500" y="162" font-size="34" font-weight="700">2008</text>
    <text x="500" y="248" font-size="20" font-weight="700">Bronce · Beijing</text>
  </g>
</svg>
