<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d">
  <title id="t">Esquema de la jugada de la palomita</title>
  <desc id="d">Cancha vista desde arriba. Nocioni saca desde el fondo izquierdo, Montecchia lleva la pelota hasta la mitad de la cancha y pasa a Ginóbili, que tira la palomita cerca del aro derecho.</desc>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0B1D33"/>
    </marker>
  </defs>
  <rect width="800" height="440" fill="#EAF3FB"/>
  <!-- Cancha -->
  <rect x="40" y="40" width="720" height="300" fill="#FFFFFF" stroke="#0B1D33" stroke-width="4"/>
  <line x1="400" y1="40" x2="400" y2="340" stroke="#0B1D33" stroke-width="3"/>
  <circle cx="400" cy="190" r="44" fill="none" stroke="#0B1D33" stroke-width="3"/>
  <rect x="40" y="130" width="150" height="120" fill="#75AADB" fill-opacity="0.35" stroke="#0B1D33" stroke-width="3"/>
  <rect x="610" y="130" width="150" height="120" fill="#75AADB" fill-opacity="0.35" stroke="#0B1D33" stroke-width="3"/>
  <circle cx="72" cy="190" r="9" fill="none" stroke="#D4A82A" stroke-width="5"/>
  <circle cx="728" cy="190" r="9" fill="none" stroke="#D4A82A" stroke-width="5"/>
  <!-- Recorrido de la jugada -->
  <path d="M86 300 L250 250" fill="none" stroke="#0B1D33" stroke-width="4" stroke-dasharray="3 0" marker-end="url(#flecha)"/>
  <path d="M265 240 C320 210 380 215 430 205" fill="none" stroke="#0B1D33" stroke-width="4" stroke-dasharray="10 8"/>
  <path d="M430 205 L540 160" fill="none" stroke="#0B1D33" stroke-width="4" marker-end="url(#flecha)"/>
  <path d="M560 150 C610 120 660 140 712 178" fill="none" stroke="#D4A82A" stroke-width="5" marker-end="url(#flecha)"/>
  <!-- Jugadores -->
  <circle cx="70" cy="305" r="19" fill="#75AADB" stroke="#0B1D33" stroke-width="3"/>
  <text x="70" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0B1D33">N</text>
  <circle cx="265" cy="240" r="19" fill="#75AADB" stroke="#0B1D33" stroke-width="3"/>
  <text x="265" y="247" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0B1D33">M</text>
  <circle cx="560" cy="150" r="19" fill="#D4A82A" stroke="#0B1D33" stroke-width="3"/>
  <text x="560" y="157" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0B1D33">G</text>
  <!-- Referencias -->
  <g font-family="Arial, sans-serif" font-size="17" fill="#0B1D33">
    <text x="40" y="378"><tspan font-weight="700">1. N = Nocioni:</tspan> saca rápido desde el fondo.</text>
    <text x="40" y="402"><tspan font-weight="700">2. M = Montecchia:</tspan> lleva la pelota con varios dribles y pasa.</text>
    <text x="40" y="426"><tspan font-weight="700">3. G = Ginóbili:</tspan> recibe y tira la palomita contra el tablero.</text>
  </g>
</svg>
